name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Check + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev

      # rustup comes with the runner: no third-party action to install Rust.
      # The version and components come from rust-toolchain.toml (Dependabot updates it).
      - name: Setup Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Type check & build
        run: pnpm build
