name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: latest

      # rustup comes with the runner: no third-party action to install Rust.
      # The version and components come from rust-toolchain.toml (Dependabot updates it).
      - name: Setup Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "APC40mk2 Bridge ${{ github.ref_name }}"
          releaseBody: "MIDI bridge for APC40 mk2 LED feedback on Windows MIDI Services 2026"
          releaseDraft: true
